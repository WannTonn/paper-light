[package]
name = "paperlight"
version = "0.3.0"
description = "Small offline document scanner for Windows"
authors = ["Paperlight"]
edition = "2021"

[lib]
name = "paperlight_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
windows = { version = "0.61", features = ["Win32_Graphics_Printing"] }
